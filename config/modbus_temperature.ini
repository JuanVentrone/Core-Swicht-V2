[MODBUS_TEMPERATURE]
# Puerto RS485 para el sensor de temperatura independiente.
port = /dev/ttyUSB1
slave_address = 1
baudrate = 9600
bytesize = 8
stopbits = 1
parity = N
timeout = 1.0
poll_interval_seconds = 2.0
reconnect_delay_seconds = 3.0
# Compatibilidad con la versión anterior.
temperature_register = 0
temperature_decimals = 1

[CHANNEL_1]
name = Transformador - 1
register = 0
decimals = 1
enabled = true

[CHANNEL_2]
name = Ambiente
register = 1
decimals = 1
enabled = true

[CHANNEL_3]
name = Canal 3
register = 2
decimals = 1
enabled = false

[CHANNEL_4]
name = Canal 4
register = 3
decimals = 1
enabled = false
